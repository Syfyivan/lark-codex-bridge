name: Bridge CI

on:
  pull_request:
    paths:
      - 'packages/bridge/**'
      - '.github/workflows/bridge-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @syfyivan/lark-codex-bridge check
      - run: pnpm --filter @syfyivan/lark-codex-bridge test
      - run: pnpm --filter @syfyivan/lark-codex-bridge changelog:check
        env:
          CHANGELOG_BASE_REF: ${{ github.event.pull_request.base.sha }}
