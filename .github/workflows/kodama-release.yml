name: Kodama Release

on:
  push:
    tags:
      - 'kodama-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --dir packages/kodama run check

      - run: pnpm --dir packages/kodama test

      - name: Build package
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          if [[ "$RUNNER_OS" == "Windows" && -z "${WIN_CSC_LINK:-}" ]]; then
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi

          pnpm --dir packages/kodama exec electron-builder --publish never

      - name: Publish mac release assets
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'macOS'
        shell: bash
        run: |
          version="$(node -p "require('./packages/kodama/package.json').version")"
          tag="${GITHUB_REF_NAME}"
          title="Kodama v${version}"
          notes="Kodama ${version} release built from ${GITHUB_SHA}."
          assets=(
            "packages/kodama/dist/Kodama-${version}-arm64-mac.zip"
            "packages/kodama/dist/Kodama-${version}-arm64-mac.zip.blockmap"
            "packages/kodama/dist/Kodama-${version}-arm64.dmg"
            "packages/kodama/dist/Kodama-${version}-arm64.dmg.blockmap"
            "packages/kodama/dist/latest-mac.yml"
          )

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --title "$title" --notes "$notes" --latest
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kodama-${{ matrix.os }}
          path: packages/kodama/dist/
